<!doctype html><html lang="en"><meta charset="utf-8"><title>Temporary media diagnosis</title><body><h1>Media diagnosis</h1><pre id="results">Starting</pre><script>
(async()=>{
 const names=['Video EcoNature.mp4','Video Capone.mp4','Video VillaBali.mp4','Video Zone.mp4','Video BeautySculpture.mp4'], report={ua:navigator.userAgent,canPlay:document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"'),files:{}};
 const render=()=>document.getElementById('results').textContent=JSON.stringify(report,null,2);
 render();
 await Promise.all(names.map(async name=>{
   const v=document.createElement('video'),x=report.files[name]={events:[]},url='/videos/'+encodeURIComponent(name);
   v.muted=true;v.defaultMuted=true;v.playsInline=true;v.preload='auto';v.style.cssText='width:1px;height:1px;position:absolute;left:0;top:0;opacity:0';document.body.appendChild(v);
   for(const event of ['loadstart','loadedmetadata','loadeddata','canplay','playing','timeupdate','stalled','error','waiting'])v.addEventListener(event,()=>{if(x.events.length<15)x.events.push(event);x.currentTime=v.currentTime;x.readyState=v.readyState;x.networkState=v.networkState;x.error=v.error?.message||v.error?.code||null;render()});
   try{const r=await fetch(url,{headers:{Range:'bytes=0-1023'},cache:'no-store'});x.http=r.status;x.type=r.headers.get('content-type');x.range=r.headers.get('content-range');x.length=(await r.arrayBuffer()).byteLength}catch(e){x.fetchError=String(e)}render();
   v.src=url;try{await Promise.race([v.play(),new Promise((_,reject)=>setTimeout(()=>reject('timeout'),8500))]);x.play='success'}catch(e){x.play=String(e?.name||e)+' '+String(e?.message||'')};render();
   await new Promise(resolve=>setTimeout(resolve,2000));x.currentTime=v.currentTime;x.paused=v.paused;x.readyState=v.readyState;x.networkState=v.networkState;x.error=v.error?.message||v.error?.code||null;v.pause();render();
 }));
 report.finished=true;render();
})();
</script></body></html>
