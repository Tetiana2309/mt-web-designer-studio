
name: Deploy M&T Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Generate video preview frames
        run: bash .github/scripts/generate-video-posters.sh

      - name: Prepare browser-compatible videos
        run: bash .github/scripts/normalize-case-videos.sh

      - name: Encode WebM fallbacks for browser compatibility
        run: bash .github/scripts/generate-browser-webm.sh

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Wait for uploaded artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}
        run: |
          for attempt in $(seq 1 12); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
              --jq '.artifacts[].name' 2>/dev/null | grep -Fxq "$ARTIFACT_NAME"; then
              echo "Pages artifact is available: $ARTIFACT_NAME"
              sleep 15
              exit 0
            fi
            echo "Waiting for Pages artifact metadata (attempt $attempt/12)"
            sleep 10
          done
          echo "Pages artifact was not visible to the API" >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
