
name: Deploy to ADM.TOOLS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never upload two builds to the same production directory simultaneously.
concurrency:
  group: mt-studio-production-ftps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Generate video preview frames
        run: bash .github/scripts/generate-video-posters.sh

      - name: Test FTPS connection
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: strict
          local-dir: ./dist/
          server-dir: ./
          dry-run: false
